<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>失控陀螺爭霸賽 - 全自動雙向同步控制台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');

:root {
  --red:      #ff1e2d;
  --red-glow: rgba(255,30,45,0.55);
  --red-dim:  #7a0010;
  --blue:     #1565ff;
  --blue-glow:rgba(21,101,255,0.55);
  --blue-dim: #062a80;
  --bg:       #06060e;
  --panel:    #0d0d1a;
  --border:   #1e1e30;
  --text:     #e8e8f8;
  --muted:    #555570;
  --gold:     #ffd700;
  --gold-glow:rgba(255,215,0,0.3);
  --silver:   #b0b0d0;
  --bronze:   #cd7f32;
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  height: 100vh;
  overflow: hidden; 
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.site-header {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 20px;
  background: rgba(13, 13, 26, 0.9);
  border-bottom: 1px solid var(--border);
  height: 50px;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.gyro-icon { font-size: 1.3rem; animation: gyroSpin 2s linear infinite; }
@keyframes gyroSpin { to { transform: rotate(360deg); } }
.site-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.2rem;
  letter-spacing: 0.05em;
  background: linear-gradient(90deg, var(--red) 0%, #fff 50%, var(--blue) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.site-sub { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; }

.photo-wall-btn {
  padding: 4px 12px;
  border-radius: 4px;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  font-size: 0.7rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.2s;
}
.photo-wall-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 12px var(--gold-glow); }

/* ── MAIN LAYOUT ── */
.main-layout {
  display: flex;
  flex-direction: column;
  flex: 1;
  height: calc(100vh - 50px);
}

/* 上半部：雙翼對稱樹狀圖 */
.bracket-container {
  flex: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 15px;
  background: #030308;
  height: 60%; /* 稍微調降樹狀圖比例 */
}

.wing {
  display: flex;
  gap: 15px;
  align-items: center;
  height: 100%;
  width: 44%;
}
.wing.left-wing { justify-content: flex-start; }
.wing.right-wing { justify-content: flex-end; flex-direction: row-reverse; } 

.bracket-round {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  height: 100%;
  width: 31%;
}
.round-header-label { text-align: center; font-family: 'Orbitron', sans-serif; font-size: 0.6rem; font-weight: 900; color: var(--gold); margin-bottom: 2px; }

/* 中央決賽核心島 */
.center-final-zone {
  width: 12%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px;
  border-left: 1px dashed rgba(30,30,48,0.5);
  border-right: 1px dashed rgba(30,30,48,0.5);
  padding: 0 5px;
}

/* 樹狀卡片 */
.tree-match-group { display: flex; flex-direction: column; justify-content: center; position: relative; width: 100%; margin: 2px 0; }
.tcard { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; cursor: pointer; transition: all 0.15s; }
.tcard.is-live { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,215,0,0.4); transform: scale(1.02); }
.tcard-header { font-size: 0.5rem; padding: 1px 4px; color: var(--muted); border-bottom: 1px solid rgba(30,30,48,0.5); display: flex; justify-content: space-between; }
.tcard-team { display: flex; justify-content: space-between; align-items: center; padding: 2px 5px; font-size: 0.68rem; font-weight: 700; height: 18px; }
.tcard-team.p-red { border-left: 2px solid var(--red); }
.tcard-team.p-blue { border-left: 2px solid var(--blue); border-top: 1px solid rgba(30,30,48,0.2); }
.tcard-team .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 75px; color: #a0a0c0; }
.tcard-team .score { font-family: 'Orbitron', sans-serif; font-weight: 900; color: var(--muted); }
.tcard-team.winner .name { color: #fff; font-weight: 900; }
.tcard-team.winner .score { color: var(--gold); }

/* ── 下半部：一體化計分台（加大物理間距、加強霓虹陰影） ── */
.control-container {
  height: 35%; /* 放大控制台空間 */
  background: var(--panel);
  border-top: 2px solid var(--border); /* 加粗邊框 */
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px 20px;
  gap: 25px;
  box-shadow: 0 -15px 30px rgba(0,0,0,0.7); /* 加強阻隔陰影，製造物理間距感 */
  z-index: 15;
}

.control-center-board { 
  display: grid; 
  grid-template-columns: 340px auto 340px; 
  background: var(--bg); 
  border: 1px solid var(--border); 
  border-radius: 6px; 
  overflow: hidden; 
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
.side { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px 20px; gap: 8px; position: relative; }
.side.red-side  { background: linear-gradient(135deg, rgba(255,30,45,0.08) 0%, transparent 80%); }
.side.blue-side { background: linear-gradient(225deg, rgba(21,101,255,0.08) 0%, transparent 80%); }

.team-name-live { 
  font-weight: 900; 
  font-size: 1.9rem; 
  text-align: center; 
  word-break: break-all; 
  min-height: 1.4em; 
  display: flex; 
  align-items: center; 
  justify-content: center;
  letter-spacing: 0.05em;
  width: 100%;
}
.red-side .team-name-live { color: #fff; text-shadow: 0 0 15px var(--red-glow); }
.blue-side .team-name-live { color: #fff; text-shadow: 0 0 15px var(--blue-glow); }

.big-score { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3.2rem; line-height: 1; }
.red-side .big-score { color: var(--red); text-shadow: 0 0 10px rgba(255,30,45,0.2); }
.blue-side .big-score { color: var(--blue); text-shadow: 0 0 10px rgba(21,101,255,0.2); }
.big-score.bump { animation: scoreBump 0.15s ease-out; }

.btn-row { display: flex; gap: 12px; }
.score-btn { width: 38px; height: 38px; border-radius: 4px; border: 1px solid; background: transparent; font-size: 1.3rem; font-weight: 900; cursor: pointer; }
.red-side .score-btn { border-color: var(--red-dim); color: var(--red); }
.blue-side .score-btn { border-color: var(--blue-dim); color: var(--blue); }
.red-side .score-btn:hover { background: var(--red); color: #fff; box-shadow: 0 0 10px var(--red-glow); }
.blue-side .score-btn:hover { background: var(--blue); color: #fff; box-shadow: 0 0 10px var(--blue-glow); }

.win-flash { font-size: 0.65rem; font-weight: 900; padding: 2px 8px; border-radius: 2px; opacity: 0; margin-top: 2px; }
.win-flash.show { opacity: 1; }
.red-side .win-flash { background: var(--red); color: #fff; }
.blue-side .win-flash { background: var(--blue); color: #fff; }

.vs-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 25px; min-width: 110px; }
.vs-text { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; color: var(--muted); }
.round-badge { padding: 4px 8px; border: 1px solid var(--border); border-radius: 2px; font-size: 0.65rem; color: var(--text); background: var(--panel); white-space: nowrap; font-weight: 700; letter-spacing: 0.05em; }
.match-info-badge { font-size: 0.6rem; color: var(--muted); margin-top: 2px; }

/* 右側功能按鈕區 */
.control-right { display: flex; flex-direction: column; gap: 8px; width: 160px; }
.action-btn { padding: 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 700; font-size: 0.72rem; cursor: pointer; text-align: center; }
.action-btn.confirm-btn { background: linear-gradient(90deg, var(--red-dim), var(--blue-dim)); border-color: transparent; color: #fff; font-size: 0.78rem; padding: 12px; }
.action-btn.confirm-btn:hover { background: linear-gradient(90deg, var(--red), var(--blue)); box-shadow: 0 0 15px rgba(150,50,150,0.5); }
.action-btn.danger-btn { border-color: rgba(255, 30, 45, 0.15); color: #ff5252; font-size: 0.65rem; padding: 4px; margin-top: 5px; }

/* ── 彈出式拍照牆 ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(4,4,8,0.96); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.active { display: flex; }
.podium-container { width: 100%; max-width: 750px; padding: 30px; background: var(--panel); border: 2px solid var(--gold); border-radius: 12px; text-align: center; box-shadow: 0 0 40px rgba(255,215,0,0.15); position: relative; }
.close-modal { position: absolute; top: 10px; right: 15px; font-size: 1.4rem; color: var(--muted); cursor: pointer; }
.podium-title { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2rem; color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); margin-bottom: 25px; }
.podium-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
.podium-box { background: rgba(6,6,14,0.8); border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
.podium-box.rank-1 { grid-column: span 2; border-color: var(--gold); background: linear-gradient(180deg, rgba(255,215,0,0.05) 0%, transparent 100%); }
.podium-box.rank-2 { border-color: var(--silver); }
.podium-box.rank-3 { border-color: var(--bronze); }
.podium-box.rank-4 { border-color: var(--muted); }
.medal-icon { font-size: 2.2rem; margin-bottom: 4px; }
.rank-label { font-size: 0.65rem; font-weight: 900; margin-bottom: 4px; }
.rank-1 .rank-label { color: var(--gold); }
.winner-name { font-size: 1.2rem; font-weight: 900; color: #fff; }
.rank-1 .winner-name { font-size: 2rem; text-shadow: 0 0 15px var(--gold-glow); }
</style>
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <div class="gyro-icon">🌀</div>
      <h1 class="site-title">失控陀螺爭霸賽</h1>
      <span class="site-sub">直覺點擊雙向即時連動控台</span>
    </div>
    <button class="photo-wall-btn" onclick="toggleModal(true)">🏆 榮譽拍照牆</button>
  </header>

  <div class="main-layout">
    
    <div class="bracket-container">
      
      <div class="wing left-wing">
        <div class="bracket-round" id="wingL-r32"><div class="round-header-label">32強賽 (左)</div></div>
        <div class="bracket-round" id="wingL-r16"><div class="round-header-label">16強 (左)</div></div>
        <div class="bracket-round" id="wingL-r8"><div class="round-header-label">8強 (左)</div></div>
      </div>

      <div class="center-final-zone">
        <div class="round-header-label" style="color:var(--red)">準決賽/決賽</div>
        <div class="tree-match-group" id="center-r4-1"></div>
        <div class="tree-match-group" id="center-r2-1"></div> <div class="tree-match-group" id="center-r2-2"></div> <div class="tree-match-group" id="center-r4-2"></div>
      </div>

      <div class="wing right-wing">
        <div class="bracket-round" id="wingR-r32"><div class="round-header-label">32強賽 (右)</div></div>
        <div class="bracket-round" id="wingR-r16"><div class="round-header-label">16強 (右)</div></div>
        <div class="bracket-round" id="wingR-r8"><div class="round-header-label">8強 (右)</div></div>
      </div>

    </div>

    <div class="control-container">
      
      <div class="control-center-board">
        <div class="side red-side">
          <div id="live-red-name" class="team-name-live">-</div>
          <div id="live-red-score" class="big-score">0</div>
          <div class="btn-row">
            <button class="score-btn minus" onclick="adjustScore('red', -1)">-</button>
            <button class="score-btn" onclick="adjustScore('red', 1)">+</button>
          </div>
          <div id="live-red-flash" class="win-flash">WINNER</div>
        </div>

        <div class="vs-col">
          <div class="vs-text">VS</div>
          <div class="round-badge" id="live-round-title">STAGE</div>
          <div class="match-info-badge" id="live-match-id">M1</div>
        </div>

        <div class="side blue-side">
          <div id="live-blue-name" class="team-name-live">-</div>
          <div id="live-blue-score" class="big-score">0</div>
          <div class="btn-row">
            <button class="score-btn minus" onclick="adjustScore('blue', -1)">-</button>
            <button class="score-btn" onclick="adjustScore('blue', 1)">+</button>
          </div>
          <div id="live-blue-flash" class="win-flash">WINNER</div>
        </div>
      </div>

      <div class="control-right">
        <button class="action-btn confirm-btn" onclick="saveAndAdvance()">確認勝出並晉級</button>
        <button class="action-btn" onclick="resetCurrentMatch()">重設單場</button>
        <button class="action-btn danger-btn" onclick="clearTournament()">重置賽事數據</button>
      </div>

    </div>
  </div>

  <div class="modal-overlay" id="photo-modal">
    <div class="podium-container">
      <span class="close-modal" onclick="toggleModal(false)">×</span>
      <h2 class="podium-title">🏆 榮譽殿堂 🏆</h2>
      <div class="podium-grid">
        <div class="podium-box rank-1"><div class="medal-icon">👑</div><div class="rank-label">CHAMPION 總冠軍</div><div id="podium-1" class="winner-name">-</div></div>
        <div class="podium-box rank-2"><div class="medal-icon">🥈</div><div class="rank-label">2ND PLACE 亞軍</div><div id="podium-2" class="winner-name">-</div></div>
        <div class="podium-box rank-3"><div class="medal-icon">🥉</div><div class="rank-label">3RD PLACE 季軍</div><div id="podium-3" class="winner-name">-</div></div>
        <div class="podium-box rank-4"><div class="medal-icon">⚙️</div><div class="rank-label">4TH PLACE 殿軍</div><div id="podium-4" class="winner-name">-</div></div>
      </div>
    </div>
  </div>

<script>
const playersList = [
  "小蔡", "Ryan", "福德正神", "阿憲", "Kuromia", "bob", "菜進去", "邱葡萄", 
  "HUNTER", "大星", "我愛吃小黃瓜", "樹林志", "Flash", "小短腿", "雷克斯", "泊浤", 
  "今天要吃甚麼", "Chiu", "福壽螺", "陀螺殺神", "adan", "小卡比", "阿輇", "我住旁邊", 
  "卡哈", "塞伊德", "甲是丁", "(輪空)", "(輪空)", "(輪空)", "(輪空)", "(輪空)"
];

let tournamentData = { r32: [], r16: [], r8: [], r4: [], r2: [] };
const stagesConfig = [
  { key: 'r32', badge: 'R32' },
  { key: 'r16', badge: 'R16' },
  { key: 'r8',  badge: 'R8' },
  { key: 'r4',  badge: 'R4' },
  { key: 'r2',  badge: 'FINALS' }
];
let currentStage = 'r32'; let currentMatchId = 1;

// ── 【💥 核心同步升級 ── 同步接收大螢幕導航訊號防線】 ──
window.addEventListener('storage', (e) => {
  // 1. 同步基礎數據（名單與分數）
  if (e.key === "gyro_tournament_save") {
    tournamentData = JSON.parse(e.newValue);
    refreshAllUI(); 
    syncScoreboardFromData();
  }
  // 2. 💥 全新加入：同步進行中場次的金色高亮導航訊號
  if (e.key === "gyro_current_match_signal") {
    const signal = JSON.parse(e.newValue);
    if(signal) {
      currentStage = signal.stage;
      currentMatchId = signal.id;
      // 另一個分頁的大螢幕卡片跟著連動高亮！
      refreshAllUI();
      syncScoreboardFromData();
    }
  }
});

function loadTournamentData() {
  const savedData = localStorage.getItem("gyro_tournament_save");
  if (savedData) {
    try {
      const parsed = JSON.parse(savedData);
      if (parsed.r32 && parsed.r32[0] && parsed.r32[0].red === "小蔡") {
        tournamentData = parsed; return;
      }
    } catch (e) {}
  }
  initNewTournament(); saveTournamentData();
}

function initNewTournament() {
  tournamentData.r32 = [];
  for(let i = 0; i < 16; i++) tournamentData.r32.push({ id: i + 1, red: playersList[i * 2], blue: playersList[i * 2 + 1], redScore: 0, blueScore: 0, winner: null });
  tournamentData.r16 = [];
  for(let i = 0; i < 8; i++) tournamentData.r16.push({ id: i + 1, red: `32強 M${i*2+1} 勝者`, blue: `32強 M${i*2+2} 勝者`, redScore: 0, blueScore: 0, winner: null });
  tournamentData.r8 = [];
  for(let i = 0; i < 4; i++) tournamentData.r8.push({ id: i + 1, red: `16強 M${i*2+1} 勝者`, blue: `16強 M${i*2+2} 勝者`, redScore: 0, blueScore: 0, winner: null });
  tournamentData.r4 = [];
  for(let i = 0; i < 2; i++) tournamentData.r4.push({ id: i + 1, red: `8強 M${i*2+1} 勝者`, blue: `8強 M${i*2+2} 勝者`, redScore: 0, blueScore: 0, winner: null });
  tournamentData.r2 = [
    { id: 1, red: "4強 M1 敗者", blue: "4強 M2 敗者", redScore: 0, blueScore: 0, winner: null },
    { id: 2, red: "4強 M1 勝者", blue: "4強 M2 勝者", redScore: 0, blueScore: 0, winner: null }
  ];
}

function saveTournamentData() { localStorage.setItem("gyro_tournament_save", JSON.stringify(tournamentData)); }

// 💥 廣播目前點選或前進的場次給大螢幕分頁
function broadcastMatchSignal(stage, id) {
  localStorage.setItem("gyro_current_match_signal", JSON.stringify({ stage: stage, id: id }));
}

document.addEventListener("DOMContentLoaded", () => {
  loadTournamentData(); refreshAllUI(); loadMatch(currentStage, currentMatchId);
});

function refreshAllUI() {
  renderWing('r32', 1, 8, 'wingL-r32'); renderWing('r32', 9, 16, 'wingR-r32');
  renderWing('r16', 1, 4, 'wingL-r16'); renderWing('r16', 5, 8, 'wingR-r16');
  renderWing('r8',  1, 2, 'wingL-r8');  renderWing('r8',  3, 4, 'wingR-r8');
  
  renderSingleMatchCard('r4', 1, 'center-r4-1');
  renderSingleMatchCard('r4', 2, 'center-r4-2');
  renderSingleMatchCard('r2', 1, 'center-r2-1'); 
  renderSingleMatchCard('r2', 2, 'center-r2-2'); 
  calculatePodium();
}

function loadMatch(stage, id) { 
  currentStage = stage; 
  currentMatchId = id; 
  syncScoreboardFromData(); 
  refreshAllUI(); 
}

function syncScoreboardFromData() {
  const match = tournamentData[currentStage].find(m => m.id === currentMatchId); if(!match) return;
  const cfg = stagesConfig.find(c => c.key === currentStage);
  document.getElementById("live-round-title").innerText = cfg.badge;
  
  let matchLabel = `M${currentMatchId}`;
  if(currentStage === 'r2') matchLabel = currentMatchId === 2 ? "冠軍賽" : "季軍賽";
  document.getElementById("live-match-id").innerText = matchLabel;
  
  document.getElementById("live-red-name").innerText = match.red;
  document.getElementById("live-blue-name").innerText = match.blue;
  document.getElementById("live-red-score").innerText = match.redScore;
  document.getElementById("live-blue-score").innerText = match.blueScore;
  updateWinFlash(match);
}

function adjustScore(side, amount) {
  const scoreEl = document.getElementById(`live-${side}-score`);
  let score = parseInt(scoreEl.innerText) + amount; if(score < 0) score = 0;
  scoreEl.innerText = score;
  scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
  
  const match = tournamentData[currentStage].find(m => m.id === currentMatchId);
  if (side === 'red') match.redScore = score; else match.blueScore = score;
  
  saveTournamentData(); refreshAllUI();
}

function updateWinFlash(match) {
  const rFlash = document.getElementById("live-red-flash"); const bFlash = document.getElementById("live-blue-flash");
  rFlash.classList.remove('show'); bFlash.classList.remove('show');
  if(match.winner === 'red') rFlash.classList.add('show'); else if(match.winner === 'blue') bFlash.classList.add('show');
}

function saveAndAdvance() {
  const match = tournamentData[currentStage].find(m => m.id === currentMatchId);
  const rScore = match.redScore; const bScore = match.blueScore;
  if(rScore === bScore) { alert("平手無法判定！"); return; }
  
  match.winner = rScore > bScore ? 'red' : 'blue';
  const winnerName = match.winner === 'red' ? match.red : match.blue;
  const loserName = match.winner === 'red' ? match.blue : match.red;
  const targetIndex = Math.floor((currentMatchId - 1) / 2);
  const isRedSlot = (currentMatchId % 2 !== 0); 
  
  if(currentStage === 'r32') { if(isRedSlot) tournamentData.r16[targetIndex].red = winnerName; else tournamentData.r16[targetIndex].blue = winnerName; } 
  else if(currentStage === 'r16') { if(isRedSlot) tournamentData.r8[targetIndex].red = winnerName; else tournamentData.r8[targetIndex].blue = winnerName; }
  else if(currentStage === 'r8') { if(isRedSlot) tournamentData.r4[targetIndex].red = winnerName; else tournamentData.r4[targetIndex].blue = winnerName; }
  else if(currentStage === 'r4') {
    if(currentMatchId === 1) { tournamentData.r2[0].red = loserName; tournamentData.r2[1].red = winnerName; } 
    else { tournamentData.r2[0].blue = loserName; tournamentData.r2[1].blue = winnerName; }
  }
  
  let nextStage = currentStage;
  let nextMatchId = currentMatchId + 1;
  
  if (nextMatchId > tournamentData[currentStage].length) {
    if (currentStage === 'r32') { nextStage = 'r16'; nextMatchId = 1; }
    else if (currentStage === 'r16') { nextStage = 'r8'; nextMatchId = 1; }
    else if (currentStage === 'r8') { nextStage = 'r4'; nextMatchId = 1; }
    else if (currentStage === 'r4') { nextStage = 'r2'; nextMatchId = 1; }
  }

  saveTournamentData();
  
  if(currentStage === 'r2') {
    if(currentMatchId === 2) alert(`🎉 恭喜【${winnerName}】榮獲總冠軍🏆！！可以前往榮譽牆分頁進行拍照囉！`);
    else alert(`🥉 恭喜【${winnerName}】贏得季軍！`);
    refreshAllUI();
  } else {
    // 💥 自動導航升級：不只更新數據，同時對外發射廣播訊號，讓大螢幕分頁跟著主動載入下一場並移動高亮框！
    broadcastMatchSignal(nextStage, nextMatchId);
    loadMatch(nextStage, nextMatchId);
  }
}

function resetCurrentMatch() {
  const match = tournamentData[currentStage].find(m => m.id === currentMatchId);
  match.redScore = 0; match.blueScore = 0; match.winner = null;
  saveTournamentData(); loadMatch(currentStage, currentMatchId); refreshAllUI();
}

// 當你手動點選任何卡片時，一併對外廣播訊號
function selectMatchFromGrid(stage, id) { 
  broadcastMatchSignal(stage, id);
  loadMatch(stage, id); 
}

function renderWing(stage, startId, endId, containerId) {
  const container = document.getElementById(containerId); if(!container) return;
  const header = container.querySelector('.round-header-label');
  container.innerHTML = ""; if(header) container.appendChild(header);

  for(let id = startId; id <= endId; id++) {
    const m = tournamentData[stage].find(item => item.id === id); if(!m) continue;
    const group = document.createElement("div"); group.className = "tree-match-group";
    const isLive = (currentStage === stage && currentMatchId === m.id);
    const wRed = m.winner === 'red' ? 'winner' : ''; const wBlue = m.winner === 'blue' ? 'winner' : '';

    group.innerHTML = `
      <div class="tcard ${isLive ? 'is-live' : ''}" onclick="selectMatchFromGrid('${stage}', ${m.id})">
        <div class="tcard-header"><span>M${m.id}</span></div>
        <div class="tcard-team p-red ${wRed}"><span class="name">${m.red}</span><span class="score">${m.redScore}</span></div>
        <div class="tcard-team p-blue ${wBlue}"><span class="name">${m.blue}</span><span class="score">${m.blueScore}</span></div>
      </div>
    `;
    container.appendChild(group);
  }
}

function renderSingleMatchCard(stage, id, containerId) {
  const container = document.getElementById(containerId); if(!container) return;
  container.innerHTML = "";
  const m = tournamentData[stage].find(item => item.id === id); if(!m) return;
  
  const isLive = (currentStage === stage && currentMatchId === m.id);
  let lbl = `4強 M${id}`; if(stage === 'r2') lbl = id === 2 ? "👑 冠軍賽" : "🥉 季軍賽";
  const wRed = m.winner === 'red' ? 'winner' : ''; const wBlue = m.winner === 'blue' ? 'winner' : '';

  container.innerHTML = `
    <div class="tcard ${isLive ? 'is-live' : ''}" style="width:100%" onclick="selectMatchFromGrid('${stage}', ${m.id})">
      <div class="tcard-header"><span>${lbl}</span></div>
      <div class="p-red ${wRed}" style="display:flex; justify-content:space-between; align-items:center; padding:2px 5px; font-size:0.68rem; font-weight:700; height:18px; border-left:2px solid var(--red);"><span class="name" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:75px; color:#a0a0c0;">${m.red}</span><span class="score" style="font-family:'Orbitron',sans-serif; font-weight:900; color:var(--muted);">${m.redScore}</span></div>
      <div class="p-blue ${wBlue}" style="display:flex; justify-content:space-between; align-items:center; padding:2px 5px; font-size:0.68rem; font-weight:700; height:18px; border-left:2px solid var(--blue); border-top:1px solid rgba(30,30,48,0.2);"><span class="name" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:75px; color:#a0a0c0;">${m.blue}</span><span class="score" style="font-family:'Orbitron',sans-serif; font-weight:900; color:var(--muted);">${m.blueScore}</span></div>
    </div>
  `;
}

function calculatePodium() {
  const m3rd = tournamentData.r2[0]; const mChamp = tournamentData.r2[1];
  if (m3rd && m3rd.winner) {
    document.getElementById("podium-3").innerText = m3rd.winner === 'red' ? m3rd.red : m3rd.blue;
    document.getElementById("podium-4").innerText = m3rd.winner === 'red' ? m3rd.blue : m3rd.red;
  }
  if (mChamp && mChamp.winner) {
    document.getElementById("podium-1").innerText = mChamp.winner === 'red' ? mChamp.red : mChamp.blue;
    document.getElementById("podium-2").innerText = mChamp.winner === 'red' ? mChamp.blue : mChamp.red;
  }
}

function toggleModal(show) { document.getElementById("photo-modal").classList.toggle("active", show); }

function clearTournament() {
  if (confirm("確定完全重置？")) {
    localStorage.removeItem("gyro_tournament_save"); initNewTournament(); saveTournamentData();
    currentStage = 'r32'; currentMatchId = 1; refreshAllUI(); loadMatch(currentStage, currentMatchId);
  }
}
</script>

</html>
