<body>
<header class="site-header">
  <div class="header-left"><span>🌀</span><h1 class="site-title">失控陀螺16強爭霸賽</h1><span class="site-sub">16人淘汰賽即時計分系統</span></div>
  <div class="header-actions">
    <button class="top-btn names" onclick="openNamesModal()">✏️ 設定參賽者名稱</button>
    <button class="top-btn points" onclick="openPointsBackend()">📊 後台積分總表</button>
    <button class="top-btn export" onclick="exportBracketToImage()">📸 輸出賽程圖</button>
    <button class="top-btn podium" onclick="togglePodium(true)">🏆 榮譽榜</button>

    </div>
  </div>
  <div class="control-container">
    <div class="control-board">
      <div class="side red-side"><div id="live-red-name" class="team-live">-</div><div id="live-red-score" class="big-score">0</div><div class="score-buttons"><button class="score-btn" onclick="adjustScore('red',-1)">−</button><button class="score-btn" onclick="adjustScore('red',1)">＋</button><button class="walkover-score-btn" onclick="winByWalkover('red')">勝</button></div></div>

  </div>

<div class="modal" id="names-modal"><div class="modal-card"><div class="modal-title-row"><h2 class="modal-title">設定參賽者名稱</h2><button class="close-btn" onclick="toggleNames(false)">×</button></div><div class="name-grid" id="name-grid"></div><div class="modal-actions"><button class="secondary-btn" onclick="resetNamesToDefault()">恢復參賽者1～16</button><button class="save-btn" onclick="saveNames()">儲存名稱並重建賽程</button></div></div></div>
<div class="modal" id="points-modal"><div class="modal-card" style="width:min(980px,97vw)"><div class="modal-title-row"><h2 class="modal-title">📊 後台積分總表</h2><button class="close-btn" onclick="togglePoints(false)">×</button></div><div class="points-toolbar"><select id="points-session-filter" onchange="renderPointsBackend()"></select><button class="secondary-btn" onclick="exportPointsCSV()">⬇️ 匯出積分 CSV</button></div><div class="points-note">積分＝每場實際取得的分數累加。排名依「總積分 → 勝場 → 淨勝分」排序；尚未完成的對戰也會計入目前比分。</div><div class="points-table-wrap"><table class="points-table"><thead><tr><th>排名</th><th>參賽者</th><th>總積分</th><th>出賽</th><th>勝</th><th>敗</th><th>失分</th><th>淨勝分</th><th>參加場次</th></tr></thead><tbody id="points-table-body"></tbody></table></div></div></div>
<div class="modal" id="podium-modal"><div class="modal-card" id="podium-capture-node"><div class="modal-title-row"><h2 class="modal-title">👑 榮譽殿堂</h2><button class="close-btn" onclick="togglePodium(false)">×</button></div><div class="podium-stage"><div class="podium-box rank2"><div>🥈 亞軍</div><div id="podium-2" class="winner-name">-</div></div><div class="podium-box rank1"><div>👑 總冠軍</div><div id="podium-1" class="winner-name">-</div></div><div class="podium-box rank3"><div>🥉 季軍</div><div id="podium-3" class="winner-name">-</div></div></div><div class="fourth">殿軍：<span id="podium-4">-</span></div><div class="modal-actions"><button class="save-btn" onclick="exportPodiumToImage()">📸 輸出榮譽榜</button></div></div></div>
<script>
const STORAGE_KEY='gyro_16_sessions_v4_fixed_final';
const LEGACY_STORAGE_KEY='gyro_16_sessions_v3_removed_zheng';
let app={sessions:[],activeSessionId:null};let currentStage='r16',currentMatchId=1;
const stageLabels={r16:'R16',r8:'R8',r4:'R4',r2:'FINALS'};
const PRESET_SESSION_PLAYERS=[["張*瑞","劉*辰","蔡*宸","李*勳","陳*翰","吳*頡","許*維","賴*淂","徐*恩","陳*旭","劉*豪","陳*恩","尤*任","林*一","許*翔","郭*宸"],["李*俊","劉*君","許*宇","尤*羽","林*宥","廖*侑","胡*祥","王*威","林*均","張*維","郭*瑋","蔡*佑","賴*維","沈*恩","陳*均","劉*佑"],["劉*佑","陳*予","陳*安","陳*昌","李*憲","陳*諭","吳*峻","廖*駿","陳*傑","李*廷","李*鋒","許*恩","(輪空)","(輪空)","(輪空)","(輪空)"]];
function defaultPlayers(){return Array.from({length:16},(_,i)=>`參賽者${i+1}`)}
function blankMatch(id,red,blue){return{id,red,blue,redScore:0,blueScore:0,winner:null}}
function makeTournament(players){return{players:[...players],r16:Array.from({length:8},(_,i)=>blankMatch(i+1,players[i*2],players[i*2+1])),r8:Array.from({length:4},(_,i)=>blankMatch(i+1,`16強 M${i*2+1} 勝者`,`16強 M${i*2+2} 勝者`)),r4:Array.from({length:2},(_,i)=>blankMatch(i+1,`8強 M${i*2+1} 勝者`,`8強 M${i*2+2} 勝者`)),r2:[blankMatch(1,'4強 M1 敗者','4強 M2 敗者'),blankMatch(2,'4強 M1 勝者','4強 M2 勝者')]}}
function newSession(index){const preset=PRESET_SESSION_PLAYERS[index-1];const players=index===4?Array.from({length:16},(_,i)=>`待晉級${i+1}`):(preset?[...preset]:defaultPlayers());return{id:'s'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:index===4?'爭奪戰':`場次${index}`,data:makeTournament(players),currentStage:'r16',currentMatchId:1,isFinalSession:index===4}}
function isPlaceholderName(name){return !name||name==='(輪空)'||/^待晉級\d+$/.test(name)||/^(16強|8強|4強).*(勝者|敗者)$/.test(name)}
function hasPlayerNumber(name){return /^\d+\.\s*/.test(String(name))}
function stripPlayerNumber(name){return String(name).replace(/^\d+\.\s*/, '')}
function syncAdvancedNames(s){const d=s.data;if(!d||!Array.isArray(d.players))return;(d.r16||[]).forEach((m,i)=>{m.red=d.players[i*2]||m.red;m.blue=d.players[i*2+1]||m.blue});(d.r16||[]).forEach(m=>{if(!m.winner)return;const idx=Math.floor((m.id-1)/2),slot=m.id%2===1?'red':'blue';if(d.r8&&d.r8[idx])d.r8[idx][slot]=m[m.winner]});(d.r8||[]).forEach(m=>{if(!m.winner)return;const idx=Math.floor((m.id-1)/2),slot=m.id%2===1?'red':'blue';if(d.r4&&d.r4[idx])d.r4[idx][slot]=m[m.winner]});(d.r4||[]).forEach(m=>{if(!m.winner||!d.r2)return;const winner=m[m.winner],loser=m[m.winner==='red'?'blue':'red'];if(m.id===1){d.r2[0].red=loser;d.r2[1].red=winner}else{d.r2[0].blue=loser;d.r2[1].blue=winner}})}
function addParticipantNumbers(){let nextNumber=1,changed=false;const candidates=new Map();app.sessions.slice(0,3).forEach(s=>{if(!s.data||!Array.isArray(s.data.players))return;s.data.players=s.data.players.map(name=>{if(isPlaceholderName(name))return name;const raw=stripPlayerNumber(name);const numbered=hasPlayerNumber(name)?name:`${nextNumber}. ${name}`;if(!hasPlayerNumber(name))changed=true;if(!candidates.has(raw))candidates.set(raw,[]);if(!candidates.get(raw).includes(numbered))candidates.get(raw).push(numbered);nextNumber++;return numbered});syncAdvancedNames(s)});const final=app.sessions[3];if(final&&final.data&&Array.isArray(final.data.players)){const used=new Map();final.data.players=final.data.players.map(name=>{if(isPlaceholderName(name)||hasPlayerNumber(name))return name;const raw=stripPlayerNumber(name),list=candidates.get(raw)||[];const pos=used.get(raw)||0;used.set(raw,pos+1);const numbered=list[pos]||list[0]||`${nextNumber++}. ${name}`;if(numbered!==name)changed=true;return numbered});syncAdvancedNames(final)}return changed}
function initApp(){let raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(LEGACY_STORAGE_KEY);if(raw){if(!localStorage.getItem(STORAGE_KEY+'_backup_before_numbering'))localStorage.setItem(STORAGE_KEY+'_backup_before_numbering',raw);try{app=JSON.parse(raw)}catch(e){}}if(!app.sessions||!app.sessions.length){app={sessions:[newSession(1),newSession(2),newSession(3),newSession(4)],activeSessionId:null}}while(app.sessions.length<4)app.sessions.push(newSession(app.sessions.length+1));if(app.sessions.length>4)app.sessions=app.sessions.slice(0,4);app.sessions.forEach((s,i)=>{s.name=i===3?'爭奪戰':`場次${i+1}`;s.isFinalSession=i===3});if(!app.activeSessionId||!app.sessions.some(s=>s.id===app.activeSessionId))app.activeSessionId=app.sessions[0].id;addParticipantNumbers();updateFinalSessionQualifiers(false);addParticipantNumbers();const s=getSession();currentStage=s.currentStage||'r16';currentMatchId=s.currentMatchId||1;saveApp()}
function saveApp(){localStorage.setItem(STORAGE_KEY,JSON.stringify(app))}
function getSession(){return app.sessions.find(s=>s.id===app.activeSessionId)}function data(){return getSession().data}
function renderSessions(){const box=document.getElementById('session-tabs');box.innerHTML='';app.sessions.forEach(s=>{const b=document.createElement('button');b.className='session-btn'+(s.id===app.activeSessionId?' active':'');b.textContent=s.name;b.onclick=()=>switchSession(s.id);box.appendChild(b)})}
function switchSession(id){const old=getSession();if(old){old.currentStage=currentStage;old.currentMatchId=currentMatchId}app.activeSessionId=id;const s=getSession();if(s&&s.isFinalSession)updateFinalSessionQualifiers(true);currentStage=s.currentStage||'r16';currentMatchId=s.currentMatchId||1;saveApp();refreshAllUI();syncScoreboard()}
function refreshAllUI(){renderSessions();renderWing('r16',1,4,'wingL-r16');renderWing('r16',5,8,'wingR-r16');renderWing('r8',1,2,'wingL-r8');renderWing('r8',3,4,'wingR-r8');renderSingle('r4',1,'center-r4-1');renderSingle('r4',2,'center-r4-2');renderSingle('r2',1,'center-r2-1');renderSingle('r2',2,'center-r2-2');calculatePodium()}
function renderWing(stage,start,end,id){const c=document.getElementById(id),head=c.querySelector('.round-header-label');c.innerHTML='';if(head)c.appendChild(head);for(let n=start;n<=end;n++){const m=data()[stage].find(x=>x.id===n);c.appendChild(card(stage,m))}}
function matchScore(m,side){if(m.winType==='walkover')return m.winner===side?'W.O.':'缺席';return side==='red'?m.redScore:m.blueScore}
function card(stage,m,label){const g=document.createElement('div');g.className='tree-match-group';const live=currentStage===stage&&currentMatchId===m.id;const title=label||`M${m.id}`;g.innerHTML=`<div class="tcard ${live?'is-live':''}" onclick="selectMatch('${stage}',${m.id})"><div class="tcard-header"><span>${title}</span></div><div class="tcard-team p-red ${m.winner==='red'?'winner':''}"><span class="name">${esc(m.red)}</span><span class="score">${matchScore(m,'red')}</span></div><div class="tcard-team p-blue ${m.winner==='blue'?'winner':''}"><span class="name">${esc(m.blue)}</span><span class="score">${matchScore(m,'blue')}</span></div></div>`;return g}
function renderSingle(stage,id,container){const c=document.getElementById(container);c.innerHTML='';const m=data()[stage].find(x=>x.id===id);let label=stage==='r4'?`4強 M${id}`:(id===1?'🥉 季軍賽':'👑 冠軍賽');c.appendChild(card(stage,m,label))}
function selectMatch(stage,id){currentStage=stage;currentMatchId=id;const s=getSession();s.currentStage=stage;s.currentMatchId=id;saveApp();refreshAllUI();syncScoreboard()}
function syncScoreboard(){const m=data()[currentStage].find(x=>x.id===currentMatchId);if(!m)return;document.getElementById('live-round-title').textContent=stageLabels[currentStage];const baseLabel=currentStage==='r2'?(currentMatchId===1?'季軍賽':'冠軍賽'):`M${currentMatchId}`;document.getElementById('live-match-id').textContent=baseLabel+(m.winType==='walkover'?' · W.O.':'');document.getElementById('live-red-name').textContent=m.red;document.getElementById('live-blue-name').textContent=m.blue;document.getElementById('live-red-score').textContent=m.redScore;document.getElementById('live-blue-score').textContent=m.blueScore}
function adjustScore(side,amt){const m=data()[currentStage].find(x=>x.id===currentMatchId);const k=side==='red'?'redScore':'blueScore';m[k]=Math.max(0,m[k]+amt);m.winner=null;m.winType=null;saveApp();refreshAllUI();syncScoreboard()}
function saveAndAdvance(){const m=data()[currentStage].find(x=>x.id===currentMatchId);if(m.redScore===m.blueScore){alert('平手無法判定勝負！');return}completeAndAdvance(m.redScore>m.blueScore?'red':'blue','score')}
function winByWalkover(winnerSide){const m=data()[currentStage].find(x=>x.id===currentMatchId);if(!m)return;const winner=m[winnerSide],absent=m[winnerSide==='red'?'blue':'red'];if(!confirm(`確定【${absent}】缺席，由【${winner}】不戰而勝並晉級？`))return;m.redScore=0;m.blueScore=0;completeAndAdvance(winnerSide,'walkover')}
function completeAndAdvance(winnerSide,winType){const d=data(),m=d[currentStage].find(x=>x.id===currentMatchId);m.winner=winnerSide;m.winType=winType;const winner=m[m.winner],loser=m[m.winner==='red'?'blue':'red'];const idx=Math.floor((currentMatchId-1)/2),redSlot=currentMatchId%2===1;if(currentStage==='r16'){d.r8[idx][redSlot?'red':'blue']=winner}else if(currentStage==='r8'){d.r4[idx][redSlot?'red':'blue']=winner}else if(currentStage==='r4'){if(currentMatchId===1){d.r2[0].red=loser;d.r2[1].red=winner}else{d.r2[0].blue=loser;d.r2[1].blue=winner}}let ns=currentStage,nm=currentMatchId+1;if(nm>d[currentStage].length){if(currentStage==='r16'){ns='r8';nm=1}else if(currentStage==='r8'){ns='r4';nm=1}else if(currentStage==='r4'){ns='r2';nm=1}}if(currentStage==='r2'){alert(currentMatchId===2?`🎉 總冠軍：【${winner}】🏆`:`🥉 季軍：【${winner}】`)}else{currentStage=ns;currentMatchId=nm}const s=getSession();s.currentStage=currentStage;s.currentMatchId=currentMatchId;if(!s.isFinalSession)updateFinalSessionQualifiers(false);saveApp();refreshAllUI();syncScoreboard()}
function resetCurrentMatch(){const m=data()[currentStage].find(x=>x.id===currentMatchId);m.redScore=m.blueScore=0;m.winner=null;m.winType=null;saveApp();refreshAllUI();syncScoreboard()}
function clearCurrentSession(){if(!confirm(`確定要重置「${getSession().name}」全部賽事資料嗎？`))return;if(getSession().isFinalSession)updateFinalSessionQualifiers(false);const players=[...data().players];getSession().data=makeTournament(players);currentStage='r16';currentMatchId=1;getSession().currentStage=currentStage;getSession().currentMatchId=currentMatchId;saveApp();refreshAllUI();syncScoreboard()}
function openNamesModal(){const grid=document.getElementById('name-grid');grid.innerHTML='';data().players.forEach((name,i)=>{const row=document.createElement('div');row.className='name-item';row.innerHTML=`<label>參賽者 ${i+1}</label><input id="player-input-${i}" maxlength="20" value="${attr(name)}" ${getSession().isFinalSession?'disabled title="爭奪戰名單由積分排名自動產生"':''}>`;grid.appendChild(row)});toggleNames(true)}
function toggleNames(show){document.getElementById('names-modal').classList.toggle('active',show)}
function resetNamesToDefault(){defaultPlayers().forEach((n,i)=>document.getElementById(`player-input-${i}`).value=n)}
function saveNames(){if(getSession().isFinalSession){alert('爭奪戰名單由場次1～3積分排名自動產生，不能手動修改。');return}const names=Array.from({length:16},(_,i)=>document.getElementById(`player-input-${i}`).value.trim()||`參賽者${i+1}`);if(!confirm('儲存名稱會重建目前場次的賽程與比分，確定嗎？'))return;getSession().data=makeTournament(names);addParticipantNumbers();currentStage='r16';currentMatchId=1;getSession().currentStage=currentStage;getSession().currentMatchId=currentMatchId;saveApp();toggleNames(false);refreshAllUI();syncScoreboard()}

function sessionHasStarted(s){return ['r16','r8','r4','r2'].some(stage=>(s.data[stage]||[]).some(m=>m.redScore>0||m.blueScore>0||m.winner))}
function getSessionRanking(s){return getPointsRows(s.id).filter(r=>r.name!=='(輪空)'&&!/^待晉級\d+$/.test(r.name))}
function buildFinalQualifiers(){const source=app.sessions.slice(0,3);if(source.length<3)return Array.from({length:16},(_,i)=>`待晉級${i+1}`);const rankings=source.map(getSessionRanking);const qualified=[];rankings.forEach(rows=>qualified.push(...rows.slice(0,5).map(r=>r.name)));const sixthCandidates=rankings.map((rows,i)=>rows[5]?({...rows[5],sourceIndex:i}):null).filter(Boolean).sort((a,b)=>b.points-a.points||b.wins-a.wins||b.diff-a.diff||a.sourceIndex-b.sourceIndex||a.name.localeCompare(b.name,'zh-Hant'));if(sixthCandidates[0])qualified.push(sixthCandidates[0].name);while(qualified.length<16)qualified.push(`待晉級${qualified.length+1}`);return qualified.slice(0,16)}
function updateFinalSessionQualifiers(showNotice){const final=app.sessions&&app.sessions[3];if(!final)return;const names=buildFinalQualifiers();const changed=JSON.stringify(final.data&&final.data.players)!==JSON.stringify(names);if(changed&&!sessionHasStarted(final)){final.data=makeTournament(names);final.currentStage='r16';final.currentMatchId=1;if(showNotice)alert('爭奪戰名單已依場次1～3最新積分排名更新。')}else if(changed&&showNotice&&sessionHasStarted(final)){alert('爭奪戰已開始比賽，為避免清除比分，晉級名單不再自動改動。')} }
function openPointsBackend(){const sel=document.getElementById('points-session-filter');sel.innerHTML='<option value="all">全部場次累積</option>'+app.sessions.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');sel.value='all';renderPointsBackend();togglePoints(true)}
function togglePoints(show){document.getElementById('points-modal').classList.toggle('active',show)}
function getPointsRows(filterId){const sessions=filterId==='all'?app.sessions:app.sessions.filter(s=>s.id===filterId);const map=new Map();const placeholder=/^(16強|8強|4強).*(勝者|敗者)$/;function ensure(name){if(!name||name==='(輪空)'||/^待晉級\d+$/.test(name)||placeholder.test(name))return null;if(!map.has(name))map.set(name,{name,points:0,played:0,wins:0,losses:0,against:0,sessions:new Set()});return map.get(name)}sessions.forEach(s=>{(s.data.players||[]).forEach(name=>{const r=ensure(name);if(r)r.sessions.add(s.name)});['r16','r8','r4','r2'].forEach(stage=>(s.data[stage]||[]).forEach(m=>{const r=ensure(m.red),b=ensure(m.blue);if(!r||!b)return;const started=m.redScore>0||m.blueScore>0||!!m.winner;if(!started)return;r.points+=Number(m.redScore)||0;b.points+=Number(m.blueScore)||0;r.against+=Number(m.blueScore)||0;b.against+=Number(m.redScore)||0;r.played++;b.played++;r.sessions.add(s.name);b.sessions.add(s.name);if(m.winner==='red'){r.wins++;b.losses++}else if(m.winner==='blue'){b.wins++;r.losses++}}))});return [...map.values()].map(r=>({...r,diff:r.points-r.against,sessionCount:r.sessions.size,sessionNames:[...r.sessions]})).sort((a,b)=>b.points-a.points||b.wins-a.wins||b.diff-a.diff||a.name.localeCompare(b.name,'zh-Hant'))}
function renderPointsBackend(){const filter=document.getElementById('points-session-filter').value||'all';const rows=getPointsRows(filter);document.getElementById('points-table-body').innerHTML=rows.map((r,i)=>`<tr class="${i<3?'rank-'+(i+1):''}"><td><span class="rank-badge">${i+1}</span></td><td class="name">${esc(r.name)}</td><td class="points-total">${r.points}</td><td>${r.played}</td><td>${r.wins}</td><td>${r.losses}</td><td>${r.against}</td><td>${r.diff>0?'+':''}${r.diff}</td><td title="${attr(r.sessionNames.join('、'))}">${r.sessionCount}</td></tr>`).join('')||'<tr><td colspan="9">目前尚無積分資料</td></tr>'}
function exportPointsCSV(){const filter=document.getElementById('points-session-filter').value||'all';const rows=getPointsRows(filter);const title=filter==='all'?'全部場次':(app.sessions.find(s=>s.id===filter)?.name||'場次');const csv=['排名,參賽者,總積分,出賽,勝,敗,失分,淨勝分,參加場次',...rows.map((r,i)=>[i+1,r.name,r.points,r.played,r.wins,r.losses,r.against,r.diff,r.sessionCount].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))].join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${title}_積分總表.csv`;a.click();URL.revokeObjectURL(a.href)}
function calculatePodium(){const third=data().r2[0],champ=data().r2[1];['1','2','3','4'].forEach(n=>document.getElementById('podium-'+n).textContent='-');if(third.winner){document.getElementById('podium-3').textContent=third[third.winner];document.getElementById('podium-4').textContent=third[third.winner==='red'?'blue':'red']}if(champ.winner){document.getElementById('podium-1').textContent=champ[champ.winner];document.getElementById('podium-2').textContent=champ[champ.winner==='red'?'blue':'red']}}
function togglePodium(show){calculatePodium();document.getElementById('podium-modal').classList.toggle('active',show)}
function exportBracketToImage(){html2canvas(document.getElementById('bracket-capture-node'),{backgroundColor:'#030308',scale:2,useCORS:true}).then(c=>downloadCanvas(c,`${getSession().name}_16強賽程圖.png`)).catch(()=>alert('賽程圖輸出失敗'))}
function exportPodiumToImage(){html2canvas(document.getElementById('podium-capture-node'),{backgroundColor:'#0d0d1a',scale:2,useCORS:true}).then(c=>downloadCanvas(c,`${getSession().name}_榮譽榜.png`))}
function downloadCanvas(c,name){const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=name;a.click()}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(v){return esc(v)}
document.addEventListener('DOMContentLoaded',()=>{initApp();refreshAllUI();syncScoreboard()});
</script>
</body>
