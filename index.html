<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>失控陀螺爭霸賽 - 雙開單頁控制台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');

:root {
  --red:      #ff1e2d;
  --red-glow: rgba(255,30,45,0.55);
  --red-dim:  #7a0010;
  --blue:     #1565ff;
  --blue-glow:rgba(21,101,255,0.55);
  --blue-dim: #062a80;
  --bg:       #06060e;
  --panel:    #0d0d1a;
  --border:   #1e1e30;
  --text:     #e8e8f8;
  --muted:    #555570;
  --gold:     #ffd700;
  --gold-glow:rgba(255,215,0,0.3);
  --silver:   #b0b0d0;
  --bronze:   #cd7f32;
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  height: 100vh;
  overflow: hidden; /* 徹底鎖死滾動條，確保一頁看完 */
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.site-header {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  background: rgba(13, 13, 26, 0.8);
  border-bottom: 1px solid var(--border);
  height: 60px;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.gyro-icon { font-size: 1.6rem; animation: gyroSpin 2s linear infinite; }
@keyframes gyroSpin { to { transform: rotate(360deg); } }
.site-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  background: linear-gradient(90deg, var(--red) 0%, #fff 50%, var(--blue) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.site-sub { font-size: 0.65rem; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }

.photo-wall-btn {
  padding: 6px 14px;
  border-radius: 4px;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  font-size: 0.75rem;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(255,215,0,0.1);
  transition: all 0.2s;
}
.photo-wall-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold-glow); }

/* ── 核心：左右雙開版面 ── */
.split-container {
  display: flex;
  flex: 1;
  height: calc(100vh - 60px);
  width: 100vw;
}

/* 左半邊：計分控制台 */
.left-panel {
  width: 35%;
  border-right: 1px solid var(--border);
  background: rgba(10, 10, 20, 0.4);
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 20px;
}

.match-selector-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.match-selector-row label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; }
.match-select {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  width: 100%;
}

.live-panel {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: inset 2px 0 20px rgba(255,30,45,0.05), inset -2px 0 20px rgba(21,101,255,0.05);
}
.side { display: flex; flex-direction: column; align-items: center; padding: 25px 10px; gap: 12px; }
.side.red-side  { background: linear-gradient(135deg, rgba(255,30,45,0.1) 0%, transparent 80%); }
.side.blue-side { background: linear-gradient(225deg, rgba(21,101,255,0.1) 0%, transparent 80%); }
.team-name-live { font-weight: 900; font-size: 1.1rem; text-align: center; word-break: break-all; min-height: 2.4em; display: flex; align-items: center; }
.red-side .team-name-live { color: #fff; text-shadow: 0 0 10px var(--red-glow); }
.blue-side .team-name-live { color: #fff; text-shadow: 0 0 10px var(--blue-glow); }

.big-score { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 4rem; line-height: 1; }
.red-side .big-score { color: var(--red); text-shadow: 0 0 20px var(--red-glow); }
.blue-side .big-score { color: var(--blue); text-shadow: 0 0 20px var(--blue-glow); }
.big-score.bump { animation: scoreBump 0.2s ease-out; }
@keyframes scoreBump { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

.score-btn { width: 36px; height: 36px; border-radius: 4px; border: 2px solid; background: transparent; font-size: 1.2rem; font-weight: 900; cursor: pointer; font-family: 'Orbitron', sans-serif; }
.red-side .score-btn { border-color: var(--red-dim); color: var(--red); }
.blue-side .score-btn { border-color: var(--blue-dim); color: var(--blue); }
.red-side .score-btn:hover { background: var(--red); color: #fff; }
.blue-side .score-btn:hover { background: var(--blue); color: #fff; }
.score-btn.minus { font-size: 1.4rem; }

.win-flash { font-size: 0.65rem; font-weight: 900; padding: 2px 6px; border-radius: 2px; opacity: 0; min-height: 18px; }
.win-flash.show { opacity: 1; }
.red-side .win-flash { background: var(--red); color: #fff; }
.blue-side .win-flash { background: var(--blue); color: #fff; }

.vs-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-width: 60px; }
.vs-text { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; color: var(--muted); }
.round-badge { padding: 2px 4px; border: 1px solid var(--border); border-radius: 2px; font-size: 0.55rem; color: var(--text); background: var(--bg); text-align: center; white-space: nowrap; }
.match-info-badge { font-size: 0.55rem; color: var(--muted); }

.action-row { display: flex; flex-direction: column; gap: 8px; }
.action-btn { padding: 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-weight: 700; font-size: 0.8rem; cursor: pointer; width: 100%; }
.action-btn.confirm-btn { background: linear-gradient(90deg, var(--red-dim), var(--blue-dim)); border-color: transparent; color: #fff; }
.action-btn.confirm-btn:hover { background: linear-gradient(90deg, var(--red), var(--blue)); box-shadow: 0 0 15px rgba(150,50,150,0.4); }
.action-btn.danger-btn { border-color: rgba(255, 30, 45, 0.2); color: #ff5252; font-size: 0.7rem; padding: 6px; }

/* 右半邊：極致壓縮版 樹狀賽程圖 */
.right-panel {
  width: 65%;
  background: var(--bg);
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  align-items: center;
  padding: 10px 20px;
}
.bracket-tree { display: flex; gap: 25px; align-items: center; height: 100%; }
.bracket-round { display: flex; flex-direction: column; justify-content: space-around; height: 100%; min-width: 150px; }
.round-header-label { text-align: center; font-family: 'Orbitron', sans-serif; font-size: 0.65rem; font-weight: 900; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 5px; }

/* 樹狀對戰小方塊 */
.tree-match-group { display: flex; flex-direction: column; justify-content: center; margin: 4px 0; position: relative; width: 160px; }

/* 壓縮版連線系統 */
.bracket-round:not(:last-child) .tree-match-group::after { content: ''; position: absolute; right: -15px; top: 50%; width: 15px; height: 1px; background: var(--border); z-index: 1; }
.bracket-round:not(:first-child) .tree-match-group::before { content: ''; position: absolute; left: -12px; top: 50%; width: 12px; height: 1px; background: var(--border); z-index: 1; }
.bracket-round:not(:last-child) .tree-match-group:nth-child(even)::after { height: calc(50% + 14px); top: 50%; border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); background: transparent; }
.bracket-round:not(:last-child) .tree-match-group:nth-child(odd)::after { height: calc(50% + 14px); top: calc(50% - (50% + 14px)); border-left: 1px solid var(--border); border-top: 1px solid var(--border); background: transparent; }
#round-r4 .tree-match-group:nth-child(odd)::after { height: calc(100% + 65px); top:-65px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); border-left:1px solid var(--border); }
#round-r4 .tree-match-group:nth-child(even)::after { display: none; }

.tcard { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; cursor: pointer; transition: all 0.15s; }
.tcard:hover { border-color: var(--muted); }
.tcard.is-live { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,215,0,0.2); }
.tcard-header { font-size: 0.5rem; padding: 2px 6px; color: var(--muted); border-bottom: 1px solid rgba(30,30,48,0.5); display: flex; justify-content: space-between; }
.tcard-header .live-tag { background: var(--gold); color: #000; padding: 0 2px; border-radius: 1px; font-weight: 900; }
.tcard-team { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; font-size: 0.7rem; font-weight: 700; height: 22px; }
.tcard-team.p-red { border-left: 2px solid var(--red); }
.tcard-team.p-blue { border-left: 2px solid var(--blue); border-top: 1px solid rgba(30,30,48,0.2); }
.tcard-team .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; color: #a0a0c0; }
.tcard-team .score { font-family: 'Orbitron', sans-serif; font-weight: 900; color: var(--muted); }
.tcard-team.winner .name { color: #fff; font-weight: 900; }
.tcard-team.winner .score { color: var(--gold); }
.finals-wrapper { display: flex; flex-direction: column; gap: 40px; }

/* ── 彈出式：榮譽殿堂大視窗 ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(4,4,8,0.95);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.podium-container { width: 100%; max-width: 800px; padding: 40px; background: var(--panel); border: 2px solid var(--gold); border-radius: 16px; text-align: center; box-shadow: 0 0 50px rgba(255,215,0,0.15); position: relative; }
.close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: var(--muted); cursor: pointer; font-weight: 700; }
.close-modal:hover { color: #fff; }
.podium-title { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2.2rem; color: var(--gold); text-shadow: 0 0 15px var(--gold-glow); margin-bottom: 30px; }
.podium-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.podium-box { background: rgba(6,6,14,0.8); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
.podium-box.rank-1 { grid-column: span 2; border-color: var(--gold); background: linear-gradient(180deg, rgba(255,215,0,0.05) 0%, transparent 100%); }
.podium-box.rank-2 { border-color: var(--silver); }
.podium-box.rank-3 { border-color: var(--bronze); }
.podium-box.rank-4 { border-color: var(--muted); }
.medal-icon { font-size: 2.5rem; margin-bottom: 5px; }
.rank-label { font-size: 0.7rem; font-weight: 900; margin-bottom: 5px; letter-spacing: 0.1em; }
.rank-1 .rank-label { color: var(--gold); }
.rank-2 .rank-label { color: var(--silver); }
.rank-3 .rank-label { color: var(--bronze); }
.rank-4 .rank-label { color: var(--muted); }
.winner-name { font-size: 1.4rem; font-weight: 900; color: #fff; }
.rank-1 .winner-name { font-size: 2.2rem; text-shadow: 0 0 20px var(--gold-glow); }
</style>
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <div class="gyro-icon">🌀</div>
      <h1 class="site-title">失控陀螺爭霸賽</h1>
      <span class="site-sub">單頁極致雙開台</span>
    </div>
    <button class="photo-wall-btn" onclick="toggleModal(true)">🏆 榮譽拍照牆</button>
  </header>

  <div class="split-container">
    
    <div class="left-panel">
      <div class="match-selector-row">
        <label for="match-select">控制目標賽局</label>
        <select id="match-select" class="match-select" onchange="loadSelectedMatch()"></select>
      </div>

      <div class="live-panel">
        <div class="side red-side">
          <span class="side-label">RED</span>
          <div id="live-red-name" class="team-name-live">紅方</div>
          <div id="live-red-score" class="big-score">0</div>
          <div class="btn-row">
            <button class="score-btn minus" onclick="adjustScore('red', -1)">-</button>
            <button class="score-btn" onclick="adjustScore('red', 1)">+</button>
          </div>
          <div id="live-red-flash" class="win-flash">WINNER</div>
        </div>
        <div class="vs-col">
          <div class="vs-text">VS</div>
          <div class="round-badge" id="live-round-title">STAGE</div>
          <div class="match-info-badge" id="live-match-id">M1</div>
        </div>
        <div class="side blue-side">
          <span class="side-label">BLUE</span>
          <div id="live-blue-name" class="team-name-live">藍方</div>
          <div id="live-blue-score" class="big-score">0</div>
          <div class="btn-row">
            <button class="score-btn minus" onclick="adjustScore('blue', -1)">-</button>
            <button class="score-btn" onclick="adjustScore('blue', 1)">+</button>
          </div>
          <div id="live-blue-flash" class="win-flash">WINNER</div>
        </div>
      </div>

      <div class="action-row">
        <button class="action-btn confirm-btn" onclick="saveAndAdvance()">確認勝出並晉級</button>
        <button class="action-btn" onclick="resetCurrentMatch()">重設單場</button>
        <button class="action-btn danger-btn" onclick="clearTournament()">重置整個賽事數據</button>
      </div>
    </div>

    <div class="right-panel">
      <div class="bracket-tree">
        <div class="bracket-round" id="round-r32"><div class="round-header-label">32強賽</div></div>
        <div class="bracket-round" id="round-r16"><div class="round-header-label">16強</div></div>
        <div class="bracket-round" id="round-r8"><div class="round-header-label">8強</div></div>
        <div class="bracket-round" id="round-r4"><div class="round-header-label">4強</div></div>
        <div class="bracket-round" id="round-r2">
          <div class="round-header-label">決賽圈</div>
          <div class="finals-wrapper" id="grid-tree-r2"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="photo-modal">
    <div class="podium-container">
      <span class="close-modal" onclick="toggleModal(false)">×</span>
      <h2 class="podium-title">🏆 榮譽殿堂 🏆</h2>
      <div class="podium-grid">
        <div class="podium-box rank-1"><div class="medal-icon">👑</div><div class="rank-label">CHAMPION 總冠軍</div><div id="podium-1" class="winner-name">-</div></div>
        <div class="podium-box rank-2"><div class="medal-icon">🥈</div><div class="rank-label">2ND PLACE 亞軍</div><div id="podium-2" class="winner-name">-</div></div>
        <div class="podium-box rank-3"><div class="medal-icon">🥉</div><div class="rank-label">3RD PLACE 季軍</div><div id="podium-3" class="winner-name">-</div></div>
        <div class="podium-box rank-4"><div class="medal-icon">⚙️</div><div class="rank-label">4TH PLACE 殿軍</div><div id="podium-4" class="winner-name">-</div></div>
      </div>
    </div>
  </div>

<script>
const playersList = [
  "小蔡", "Ryan", "福德正神", "阿憲", "Kuromia", "bob", "菜進去", "邱葡萄", 
  "HUNTER", "大星", "我愛吃小黃瓜", "樹林志", "Flash", "小短腿", "雷克斯", "泊浤", 
  "今天要吃甚麼", "Chiu", "福壽螺", "陀螺殺神", "adan", "小卡比", "阿輇", "我住旁邊", 
  "卡哈", "塞伊德", "甲是丁", "(輪空)", "(輪空)", "(輪空)", "(輪空)", "(輪空)"
];

let tournamentData = { r32: [], r16: [], r8: [], r4: [], r2: [] };
const stagesConfig = [
  { key: 'r32', name: '32強賽', badge: 'R32' },
  { key: 'r16', name: '16強賽', badge: 'R16' },
  { key: 'r8',  name: '8強半準決賽', badge: 'R8' },
  { key: 'r4',  name: '4強準決賽', badge: 'R4' },
  { key: 'r2',  name: '總決賽階級', badge: 'FINALS' }
];
let currentStage = 'r32'; let currentMatchId = 1;

window.addEventListener('storage', (e) => {
  if (e.key === "gyro_tournament_save") {
    tournamentData = JSON.parse(e.newValue);
    refreshAllUI(); syncScoreboardFromData();
  }
});

function loadTournamentData() {
  const savedData = localStorage.getItem("gyro_tournament_save");
  if (savedData) {
    try {
      const parsed = JSON.parse(savedData);
      if (parsed.r32 && parsed.r32[0] && parsed.r32[0].red === "小蔡") {
        tournamentData = parsed; return;
      }
    } catch (e) {}
  }
  initNewTournament(); saveTournamentData();
}

function initNewTournament() {
  tournamentData.r32 = [];
  for(let i = 0; i < 16; i++) tournamentData.r32.push({ id: i + 1, red: playersList[i * 2], blue: playersList[i * 2 + 1], redScore: 0, blueScore: 0, winner: null });
  tournamentData.r16 = [];
  for(let i = 0; i < 8; i++) tournamentData.r16.push({ id: i + 1, red: `32強 M${i*2+1} 勝者`, blue: `32強 M${i*2+2} 勝者`, redScore: 0, blueScore: 0, winner: null });
  tournamentData.r8 = [];
  for(let i = 0; i < 4; i++) tournamentData.r8.push({ id: i + 1, red: `16強 M${i*2+1} 勝者`, blue: `16強 M${i*2+2} 勝者`, redScore: 0, blueScore: 0, winner: null });
  tournamentData.r4 = [];
  for(let i = 0; i < 2; i++) tournamentData.r4.push({ id: i + 1, red: `8強 M${i*2+1} 勝者`, blue: `8強 M${i*2+2} 勝者`, redScore: 0, blueScore: 0, winner: null });
  tournamentData.r2 = [
    { id: 1, red: "4強 M1 敗者", blue: "4強 M2 敗者", redScore: 0, blueScore: 0, winner: null },
    { id: 2, red: "4強 M1 勝者", blue: "4強 M2 勝者", redScore: 0, blueScore: 0, winner: null }
  ];
}

function saveTournamentData() { localStorage.setItem("gyro_tournament_save", JSON.stringify(tournamentData)); }

document.addEventListener("DOMContentLoaded", () => {
  loadTournamentData(); refreshAllUI(); loadMatch(currentStage, currentMatchId);
});

function refreshAllUI() {
  renderSelectOptions();
  renderTreeRound('r32', 'round-r32'); renderTreeRound('r16', 'round-r16');
  renderTreeRound('r8', 'round-r8'); renderTreeRound('r4', 'round-r4');
  renderTreeRound('r2', 'grid-tree-r2'); calculatePodium();
}

function renderSelectOptions() {
  const select = document.getElementById("match-select"); if (!select) return;
  const currentVal = select.value; select.innerHTML = "";
  stagesConfig.forEach(cfg => {
    let grp = document.createElement("optgroup"); grp.label = `【${cfg.name}】`;
    tournamentData[cfg.key].forEach(m => {
      let opt = document.createElement("option"); opt.value = `${cfg.key}-${m.id}`;
      let txt = `M${m.id}：${m.red} VS ${m.blue}`;
      if(cfg.key === 'r2') txt = m.id === 2 ? `👑 冠軍賽：${m.red}` : `🥉 季軍賽：${m.red}`;
      if(m.winner) txt += " (已完賽)";
      opt.innerText = txt; grp.appendChild(opt);
    });
    select.appendChild(grp);
  });
  if (currentVal) select.value = currentVal;
}

function loadSelectedMatch() {
  const val = document.getElementById("match-select").value.split('-');
  loadMatch(val[0], parseInt(val[1]));
}

function loadMatch(stage, id) { currentStage = stage; currentMatchId = id; syncScoreboardFromData(); }

function syncScoreboardFromData() {
  const match = tournamentData[currentStage].find(m => m.id === currentMatchId); if(!match) return;
  const cfg = stagesConfig.find(c => c.key === currentStage);
  document.getElementById("live-round-title").innerText = cfg.badge;
  document.getElementById("live-match-id").innerText = `M${currentMatchId}`;
  document.getElementById("live-red-name").innerText = match.red;
  document.getElementById("live-blue-name").innerText = match.blue;
  document.getElementById("live-red-score").innerText = match.redScore;
  document.getElementById("live-blue-score").innerText = match.blueScore;
  document.getElementById("match-select").value = `${currentStage}-${currentMatchId}`;
  updateWinFlash(match);
}

function adjustScore(side, amount) {
  const scoreEl = document.getElementById(`live-${side}-score`);
  let score = parseInt(scoreEl.innerText) + amount; if(score < 0) score = 0;
  scoreEl.innerText = score;
  scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
  
  const match = tournamentData[currentStage].find(m => m.id === currentMatchId);
  if (side === 'red') match.redScore = score; else match.blueScore = score;
  
  saveTournamentData(); refreshAllUI();
}

function updateWinFlash(match) {
  const rFlash = document.getElementById("live-red-flash"); const bFlash = document.getElementById("live-blue-flash");
  rFlash.classList.remove('show'); bFlash.classList.remove('show');
  if(match.winner === 'red') rFlash.classList.add('show'); else if(match.winner === 'blue') bFlash.classList.add('show');
}

function saveAndAdvance() {
  const match = tournamentData[currentStage].find(m => m.id === currentMatchId);
  const rScore = match.redScore; const bScore = match.blueScore;
  if(rScore === bScore) { alert("平手無法判定！"); return; }
  
  match.winner = rScore > bScore ? 'red' : 'blue';
  const winnerName = match.winner === 'red' ? match.red : match.blue;
  const loserName = match.winner === 'red' ? match.blue : match.red;
  const targetIndex = Math.floor((currentMatchId - 1) / 2);
  const isRedSlot = (currentMatchId % 2 !== 0); 
  
  if(currentStage === 'r32') { if(isRedSlot) tournamentData.r16[targetIndex].red = winnerName; else tournamentData.r16[targetIndex].blue = winnerName; } 
  else if(currentStage === 'r16') { if(isRedSlot) tournamentData.r8[targetIndex].red = winnerName; else tournamentData.r8[targetIndex].blue = winnerName; }
  else if(currentStage === 'r8') { if(isRedSlot) tournamentData.r4[targetIndex].red = winnerName; else tournamentData.r4[targetIndex].blue = winnerName; }
  else if(currentStage === 'r4') {
    if(currentMatchId === 1) { tournamentData.r2[0].red = loserName; tournamentData.r2[1].red = winnerName; } 
    else { tournamentData.r2[0].blue = loserName; tournamentData.r2[1].blue = winnerName; }
  }
  
  saveTournamentData(); refreshAllUI();
  if(currentMatchId < tournamentData[currentStage].length) loadMatch(currentStage, currentMatchId + 1);
}

function resetCurrentMatch() {
  const match = tournamentData[currentStage].find(m => m.id === currentMatchId);
  match.redScore = 0; match.blueScore = 0; match.winner = null;
  saveTournamentData(); loadMatch(currentStage, currentMatchId); refreshAllUI();
}

function selectMatchFromGrid(stage, id) { loadMatch(stage, id); }

function renderTreeRound(stage, targetContainerId) {
  const container = document.getElementById(targetContainerId); if (!container) return;
  if (stage !== 'r2') {
    const header = container.querySelector('.round-header-label');
    container.innerHTML = ""; if (header) container.appendChild(header);
  } else { container.innerHTML = ""; }

  tournamentData[stage].forEach(m => {
    const isLive = (currentStage === stage && currentMatchId === m.id);
    const group = document.createElement("div"); group.className = "tree-match-group";
    let lbl = `M${m.id}`; if(stage === 'r2') lbl = m.id === 2 ? "👑 冠軍賽" : "🥉 季軍賽";
    const wRed = m.winner === 'red' ? 'winner' : ''; const wBlue = m.winner === 'blue' ? 'winner' : '';

    group.innerHTML = `
      <div class="tcard ${isLive ? 'is-live' : ''}" onclick="selectMatchFromGrid('${stage}', ${m.id})">
        <div class="tcard-header"><span>${lbl}</span>${isLive ? '<span class="live-tag">LIVE</span>' : ''}</div>
        <div class="tcard-team p-red ${wRed}"><span class="name">${m.red}</span><span class="score">${m.redScore}</span></div>
        <div class="tcard-team p-blue ${wBlue}"><span class="name">${m.blue}</span><span class="score">${m.blueScore}</span></div>
      </div>
    `;
    container.appendChild(group);
  });
}

function calculatePodium() {
  const m3rd = tournamentData.r2[0]; const mChamp = tournamentData.r2[1];
  if (m3rd && m3rd.winner) {
    document.getElementById("podium-3").innerText = m3rd.winner === 'red' ? m3rd.red : m3rd.blue;
    document.getElementById("podium-4").innerText = m3rd.winner === 'red' ? m3rd.blue : m3rd.red;
  }
  if (mChamp && mChamp.winner) {
    document.getElementById("podium-1").innerText = mChamp.winner === 'red' ? mChamp.red : mChamp.blue;
    document.getElementById("podium-2").innerText = mChamp.winner === 'red' ? mChamp.blue : mChamp.red;
  }
}

function toggleModal(show) { document.getElementById("photo-modal").classList.toggle("active", show); }

function clearTournament() {
  if (confirm("確定完全重置？")) {
    localStorage.removeItem("gyro_tournament_save"); initNewTournament(); saveTournamentData();
    currentStage = 'r32'; currentMatchId = 1; refreshAllUI(); loadMatch(currentStage, currentMatchId);
  }
}
</script>
